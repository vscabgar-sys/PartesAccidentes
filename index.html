<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parte de Accidente — Echeyde</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  /* Paleta corporativa Echeyde (logo oficial): marino y celeste institucionales */
  --ink: #1D4D89;
  --ink-soft: #143A68;
  --ink-deep: #0F2C4F;
  --ink-tint: #E9F6FC;
  --sky: #74C9E6;
  --sky-soft: #EAF7FC;
  --slate: #3B3F44;
  --slate-light: #767C82;
  --paper: #F5F7F8;
  --paper-raised: #FFFFFF;
  --line: #DCE2E6;
  --line-soft: #EBEEF0;
  --amber: #B8792E;
  --amber-soft: #F1E3CE;
  --burgundy: #93342E;
  --burgundy-soft: #F5E3E1;
  --forest: #3F6B52;
  --forest-soft: #E3EDE6;
  --orange: #C4691F;
  --orange-soft: #FBE9DA;
  --radius: 4px;
  --radius-lg: 6px;
  --shadow: 0 1px 2px rgba(15,44,79,.07), 0 6px 18px rgba(15,44,79,.08);
  --shadow-lg: 0 10px 34px rgba(15,44,79,.16);
  font-size: 16px;
}
*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--paper);
  color: var(--slate);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4{
  font-family: 'Source Serif 4', Georgia, serif;
  font-weight: 600;
  margin: 0 0 .35em 0;
  color: var(--ink);
  letter-spacing: -.01em;
}
h1{ font-size: 1.6rem; }
h2{ font-size: 1.25rem; }
h3{ font-size: 1.02rem; }
p{ margin: 0 0 .75em 0; }
a{ color: var(--ink); }
button{ font-family: inherit; }
input, select, textarea{
  font-family: inherit; font-size: .95rem; color: var(--slate);
  background: var(--paper-raised); border: 1px solid var(--line);
  border-radius: var(--radius); padding: .55em .7em; width: 100%;
}
input:focus, select:focus, textarea:focus, button:focus-visible{
  outline: 2px solid var(--ink); outline-offset: 1px;
}
label{ display:block; font-size: .8rem; color: var(--slate); margin-bottom: .3em; font-weight: 500; }
.field{ margin-bottom: 1em; }
.field-row{ display:flex; gap: 1em; }
.field-row > .field{ flex:1; min-width: 0; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5em;
  border-radius: var(--radius); border: 1px solid transparent;
  padding: .62em 1.15em; font-size: .9rem; font-weight: 600; cursor: pointer;
  transition: background .15s ease, border-color .15s ease, transform .05s ease;
}
.btn:active{ transform: translateY(1px); }
.btn-primary{ background: var(--ink); color: #fff; }
.btn-primary:hover{ background: var(--ink-soft); }
.btn-outline{ background: transparent; color: var(--ink); border-color: var(--line); }
.btn-outline:hover{ border-color: var(--ink); }
.btn-amber{ background: var(--amber); color: #fff; }
.btn-amber:hover{ background: #a06a26; }
.btn-danger{ background: transparent; color: var(--burgundy); border-color: var(--burgundy-soft); }
.btn-danger:hover{ background: var(--burgundy-soft); }
.btn-ghost{ background: transparent; color: var(--slate-light); border-color: transparent; padding: .5em .7em; }
.btn-ghost:hover{ color: var(--ink); }
.btn-sm{ padding: .4em .8em; font-size: .8rem; }
.btn-lg{ padding: .9em 1.8em; font-size: 1rem; }
.btn[disabled]{ opacity: .5; cursor: not-allowed; }
.btn-block{ width:100%; }

/* ---------- Cabecera corporativa ---------- */
#topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding: .85em 1.8em; background: var(--ink);
  border-bottom: 3px solid var(--sky);
}
#topbar .brand{ display:flex; align-items:center; gap:.7em; }
#topbar .brand img{ height: 34px; display:block; }
#topbar .brand .word{ font-family:'Source Serif 4', serif; font-weight:600; color: #fff; font-size:1.02rem; line-height:1.1; letter-spacing:.01em; }
#topbar .brand .word small{ display:block; font-family:'IBM Plex Sans',sans-serif; font-weight:400; font-size:.68rem; color: #BFD7EC; }

#main{ max-width: 1000px; margin: 0 auto; padding: 2.2em 1.8em 4em; }
.view{ display:none; }
.view.active{ display:block; animation: fade-in .18s ease; }
@keyframes fade-in{ from{opacity:0; transform: translateY(3px);} to{opacity:1; transform:none;} }

.view-header{ margin-bottom: 1.6em; }
.view-header .eyebrow{ font-size:.76rem; color: var(--slate-light); margin-bottom:.15em; text-transform:uppercase; letter-spacing:.04em; }

/* ---------- Tarjeta central "Iniciar Trámite" ---------- */
#landing-wrap{
  min-height: calc(100vh - 74px);
  display:flex; align-items:center; justify-content:center;
  padding: 2em 1em;
}
.landing-card{
  width: 460px; max-width: 100%;
  background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-lg);
  box-shadow: var(--shadow); padding: 2.8em 2.4em; text-align:center;
}
.landing-card .icon-ring{
  width: 60px; height:60px; border-radius:50%; background: var(--sky);
  display:flex; align-items:center; justify-content:center; margin: 0 auto 1.1em;
  color: #fff; font-size:1.6rem; box-shadow: 0 6px 18px rgba(116,201,230,.5);
}
.landing-card h1{ font-size:1.4rem; margin-bottom:.4em; }
.landing-card p{ color: var(--slate-light); font-size:.9rem; margin-bottom:1.7em; }

/* ---------- Cards / secciones ---------- */
.card{
  background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-lg);
  box-shadow: var(--shadow); padding: 1.5em 1.6em; margin-bottom: 1.3em;
}
.card-title{
  display:flex; align-items:center; gap:.6em;
  font-family:'Source Serif 4', serif; font-size:1rem; font-weight:600;
  margin-bottom: 1.1em; padding-bottom:.7em; border-bottom: 1px solid var(--line-soft);
}
.card-title .tag{ font-family:'IBM Plex Mono', monospace; font-size:.66rem; color: var(--slate-light); border: 1px solid var(--line); border-radius: 20px; padding: .15em .6em; }

.autocomplete{ position:relative; }
.autocomplete-list{
  position:relative; z-index:20; background:#fff; border:1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); max-height: 260px; overflow-y:auto; margin-top:.5em; display:none;
}
.autocomplete-list.show{ display:block; }
.autocomplete-item{ padding:.6em .8em; cursor:pointer; font-size:.88rem; border-bottom:1px solid var(--line-soft); text-align:left; }
.autocomplete-item:last-child{ border-bottom:none; }
.autocomplete-item:hover, .autocomplete-item.hl{ background: var(--ink-tint); }
.autocomplete-item .name{ font-weight:600; color: var(--slate); }
.autocomplete-item .meta{ color: var(--slate-light); font-size:.78rem; }

.badge{ display:inline-block; padding:.2em .6em; border-radius:20px; font-size:.72rem; font-weight:600; }
.badge-amber{ background: var(--amber-soft); color:#8a5c1f; }
.badge-forest{ background: var(--forest-soft); color: var(--forest); }
.badge-burgundy{ background: var(--burgundy-soft); color: var(--burgundy); }
.badge-slate{ background:#EEF0F1; color: var(--slate-light); }

.table-scroll{ width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
table{ width:100%; border-collapse: collapse; font-size:.88rem; min-width: 560px; }
th{ text-align:left; font-size:.72rem; color: var(--slate-light); padding:.5em .6em; border-bottom:1px solid var(--line); font-weight:600; white-space:nowrap; }
td{ padding:.65em .6em; border-bottom:1px solid var(--line-soft); vertical-align: top; }
tr.clickable{ cursor:pointer; }
tr.clickable:hover td{ background: var(--ink-tint); }

/* ---------- Modal / asistente de trámite ---------- */
.modal-backdrop{
  position:fixed; inset:0; background: rgba(15,30,45,.58);
  display:none; align-items:center; justify-content:center; z-index:100; padding: 1em;
}
.modal-backdrop.show{ display:flex; }
.modal-box{ background:#fff; border-radius: var(--radius-lg); width: 480px; max-width:100%; max-height: 92vh; overflow-y:auto; box-shadow: var(--shadow-lg); }
.modal-head{ padding: 1.2em 1.5em .9em; border-bottom:1px solid var(--line-soft); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:#fff; }
.modal-head .step{ font-family:'IBM Plex Mono',monospace; font-size:.7rem; color: var(--slate-light); }
.modal-head h3{ margin:0; font-size:1.03rem; }
.modal-body{ padding: 1.4em 1.5em; }
.modal-body .q{ font-size:.95rem; margin-bottom: 1em; color: var(--slate); }
.modal-yesno{ display:flex; gap:.7em; }
.modal-yesno .btn{ flex:1; }
.modal-foot{ padding: .9em 1.5em 1.3em; display:flex; justify-content:flex-end; gap:.6em; }
.modal-block{
  border-radius: var(--radius); padding: 1em 1.1em; font-size:.88rem; margin-bottom: 1em;
}
.modal-block.warn{ background: var(--burgundy-soft); color: var(--burgundy); border-left: 4px solid var(--burgundy); font-weight:500; }
.modal-block.ok{ background: var(--forest-soft); color: var(--forest); }

.timer-box{ display:flex; flex-wrap:wrap; align-items:center; gap:1.2em; background: var(--ink); border-radius: var(--radius-lg); padding: 1.1em 1.4em; color:#fff; }
.timer-display{ font-family:'IBM Plex Mono', monospace; font-size: 2rem; font-weight:600; letter-spacing: .02em; min-width: 3.6em; color: var(--sky); }
.timer-label{ font-size:.76rem; color:#CFE1E8; }
.timer-controls{ display:flex; gap:.5em; margin-left:auto; }

.empty-state{ text-align:center; padding: 3em 1em; color: var(--slate-light); }
.empty-state h3{ color: var(--slate); }

#toast{
  position:fixed; bottom:1.6em; right:1.6em; left:1.6em; background: var(--ink); color:#fff;
  padding: .85em 1.2em; border-radius: var(--radius); box-shadow: var(--shadow);
  font-size:.87rem; z-index:200; opacity:0; transform: translateY(8px);
  transition: opacity .2s ease, transform .2s ease; pointer-events:none;
  max-width: 420px; margin-left:auto;
}
#toast.show{ opacity:1; transform:none; }
#toast.error{ background: var(--burgundy); }
#toast.ok{ background: var(--forest); }

.muted{ color: var(--slate-light); font-size:.83rem; }
.hr{ border:none; border-top:1px solid var(--line); margin: 1.4em 0; }
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:1em; }
.upload-drop{ border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 1.8em; text-align:center; color: var(--slate); font-size:.87rem; cursor:pointer; background: var(--paper); }
.upload-drop:hover{ border-color: var(--ink); }
.small-note{ font-size:.76rem; color: var(--slate-light); margin-top:.3em; }
.toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:1em; padding:.6em 0; border-bottom:1px solid var(--line-soft); }
.toggle-row:last-child{ border-bottom:none; }
.switch{ position:relative; display:inline-block; width:42px; height:24px; flex-shrink:0; }
.switch input{ opacity:0; width:0; height:0; }
.switch .track{ position:absolute; inset:0; background:#CCC; border-radius:24px; transition:.15s; cursor:pointer; }
.switch .track:before{ content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.15s; }
.switch input:checked + .track{ background: var(--forest); }
.switch input:checked + .track:before{ transform: translateX(18px); }

/* ---------- Landing: buscador + últimos partes + accesos ---------- */
#landing-layout{
  display:flex; gap:2.2em; align-items:flex-start; max-width: 1080px; margin: 1.2em auto 0;
  padding: 0 1em;
}
#landing-side{ width: 300px; flex-shrink:0; }
#landing-center{ flex:1; display:flex; flex-direction:column; align-items:center; padding-top: 1.2em; min-width:0; }

.landing-card.primary{
  background: linear-gradient(155deg, var(--ink) 0%, var(--ink-deep) 100%);
  border-color: var(--ink); color:#fff;
  width: 380px; max-width:100%;
  cursor:pointer; transition: box-shadow .15s ease, transform .1s ease;
}
.landing-card.primary .icon-ring{ background: rgba(255,255,255,.16); box-shadow:none; }
.landing-card.primary h1{ color:#fff; }
.landing-card.primary p{ color: #CFE1EE; }
.landing-card.primary:hover{ box-shadow: 0 14px 34px rgba(15,44,79,.4); }
.landing-card.primary:active{ transform: translateY(1px); }

.landing-card.admin-mini{
  width: 380px; max-width:100%; margin-top: 1em; padding: 1em 1.4em; background:#fff; border:1px solid var(--line);
  color: var(--slate); font-weight:600; font-size:.9rem; text-align:center; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:.5em;
}
.landing-card.admin-mini:hover{ border-color: var(--ink); color: var(--ink); }

.parte-card{
  background: #fff; border:1px solid var(--line); border-left: 4px solid var(--sky);
  border-radius: var(--radius); padding: .75em .95em; margin-bottom: .65em; cursor:pointer;
  box-shadow: var(--shadow);
  transition: border-color .12s ease, box-shadow .15s ease, transform .1s ease;
}
.parte-card:hover{ border-left-color: var(--ink); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.parte-card.loading{ opacity:.6; pointer-events:none; }
.parte-card .exp{
  display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:.66rem; font-weight:600;
  color: var(--orange); background: var(--orange-soft); padding:.1em .5em; border-radius:3px; margin-bottom:.3em;
}
.parte-card .name{ font-weight:600; font-size:.88rem; color: var(--slate); }
.parte-card .date{ font-size:.75rem; color: var(--slate-light); }

/* ---------- Pestañas del panel de Administrador ---------- */
.pill-tabs{ display:flex; gap:.5em; margin-bottom: 1.4em; flex-wrap:wrap; }
.pill-tabs .pill{
  border:1px solid var(--line); background:#fff; color: var(--slate);
  padding:.5em 1.1em; border-radius: 20px; font-size:.85rem; font-weight:600; cursor:pointer;
}
.pill-tabs .pill.active{ background: var(--ink); border-color: var(--ink); color:#fff; }

.login-error{
  background: var(--burgundy-soft); color: var(--burgundy); border-radius: var(--radius);
  padding: .6em .8em; font-size: .83rem; margin-bottom: 1em; display:none;
}
.login-error.show{ display:block; }

/* =====================================================================
   Responsive: la app se adapta a portátil, tablet, móvil y pantallas grandes
   ===================================================================== */

/* Pantallas grandes: evita que el contenido se estire en exceso */
@media (min-width: 1400px){
  #main{ max-width: 1120px; }
  #landing-layout{ max-width: 1180px; }
}

/* Tablet */
@media (max-width: 860px){
  #landing-layout{ flex-direction:column; align-items:center; gap:1.6em; }
  #landing-side{ width:100%; max-width: 460px; }
  #landing-center{ width:100%; padding-top:0; }
  .landing-card.primary, .landing-card.admin-mini{ width:100%; max-width:460px; }
  .grid-2{ grid-template-columns: 1fr; }
}

/* Móvil */
@media (max-width: 640px){
  html{ font-size: 15px; }
  #topbar{ padding: .75em 1.1em; }
  #topbar .brand img{ height:28px; }
  #main{ padding: 1.3em 1em 3em; }
  .card{ padding: 1.2em 1.1em; }
  .landing-card{ padding: 2em 1.4em; }
  .field-row{ flex-direction:column; gap:0; }
  .modal-box{ width:100%; }
  .modal-body, .modal-head, .modal-foot{ padding-left:1.1em; padding-right:1.1em; }
  #toast{ left:1em; right:1em; max-width:none; }
  .view-header h1{ font-size:1.35rem; }
}

@media (max-width: 380px){
  .landing-card.primary, .landing-card.admin-mini{ width:100%; }
}

</style>
</head>

<script type="module">
  // ==================== js/firebase-config.js ====================
// ============================================================================
// CONFIGURACIÓN DE FIREBASE
// ----------------------------------------------------------------------------
// Rellena con los datos de TU proyecto Firebase:
// Firebase Console > Configuración del proyecto > General > Tus apps > Web.
//
// Antes de usar la app, en Firebase Console:
//   1. Crea el proyecto.
//   2. Authentication > Sign-in method > activa "Anónimo" (Anonymous).
//      (Permiso técnico interno para que la app use Firestore; no muestra
//      ninguna pantalla ni pide datos a nadie — se conecta solo, en silencio.)
//   3. Firestore Database > crea la base de datos (modo producción).
//   4. Firestore Database > Reglas > pega el contenido de firestore.rules.
// ============================================================================

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_PROYECTO.firebaseapp.com",
  projectId: "TU_PROYECTO",
  storageBucket: "TU_PROYECTO.appspot.com",
  messagingSenderId: "TU_SENDER_ID",
  appId: "TU_APP_ID"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, addDoc,
  deleteDoc, query, where, orderBy, limit, serverTimestamp, Timestamp, writeBatch,
  enableIndexedDbPersistence, runTransaction, getDocFromCache, getDocsFromCache
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

enableIndexedDbPersistence(db).catch(()=>{ /* varias pestañas abiertas: se ignora */ });

  // ==================== js/utils.js ====================
// Utilidades compartidas por toda la app.

function slugify(str){
  return (str||"")
    .toString()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/(^-|-$)/g,"");
}

function normalizeKey(str){
  return (str||"").toString()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/\s+/g," ")
    .trim();
}
function buildRowIndex(row){
  const idx = {};
  for (const k of Object.keys(row)) idx[normalizeKey(k)] = row[k];
  return idx;
}
function pick(rowIndex, ...candidates){
  for (const c of candidates){
    const v = rowIndex[normalizeKey(c)];
    if (v !== undefined) return v;
  }
  return "";
}

function studentId(row){
  const idx = buildRowIndex(row);
  const nif = clean(pick(idx, "NIF - NIE", "NIF-NIE", "NIF"));
  const cial = clean(pick(idx, "CIAL"));
  if (nif) return "nif-" + slugify(nif);
  if (cial) return "cial-" + slugify(cial);
  const base = `${pick(idx,"Nombre")}-${pick(idx,"Primer apellido")}-${pick(idx,"Segundo apellido")}-${pick(idx,"Fecha de nacimiento")}`;
  return "gen-" + slugify(base);
}

function clean(v){
  if (v === undefined || v === null) return "";
  return v.toString().trim();
}

function parseSpanishDate(str){
  if (!str) return null;
  const m = clean(str).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const [, d, mo, y] = m;
  const date = new Date(Number(y), Number(mo)-1, Number(d));
  return isNaN(date.getTime()) ? null : date;
}

function formatDateEs(date){
  if (!date) return "";
  const d = (date instanceof Date) ? date : date.toDate ? date.toDate() : new Date(date);
  return d.toLocaleDateString("es-ES", { day:"2-digit", month:"2-digit", year:"numeric" });
}
function formatDateTimeEs(date){
  if (!date) return "";
  const d = (date instanceof Date) ? date : date.toDate ? date.toDate() : new Date(date);
  return d.toLocaleDateString("es-ES", { day:"2-digit", month:"2-digit", year:"numeric" }) + " · " +
         d.toLocaleTimeString("es-ES", { hour:"2-digit", minute:"2-digit" });
}
function dateToInputValue(date){
  if (!date) return "";
  const d = (date instanceof Date) ? date : date.toDate ? date.toDate() : new Date(date);
  const pad = n => n.toString().padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function inputValueToDate(v){
  if (!v) return null;
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

const MESES_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function mesEs(date){ return MESES_ES[date.getMonth()]; }

// Para escribir dígitos en los recuadros del formulario (uno por casilla).
function digits2(n){ return n.toString().padStart(2,"0").split(""); }
function digits4(n){ return n.toString().padStart(4,"0").split(""); }

function parseAddress(str){
  const s = clean(str);
  const out = { calle:"", cp:"", poblacion:"", provincia:"" };
  if (!s) return out;
  const cpMatch = s.match(/C\.?P\.?\s*(\d{4,5})/i);
  const munMatch = s.match(/Municipio\s+(.+)$/i);
  if (cpMatch) out.cp = cpMatch[1];
  if (munMatch) out.poblacion = titleCase(munMatch[1].trim());
  out.calle = s.split(/C\.?P\.?/i)[0].trim();
  out.provincia = "Santa Cruz de Tenerife";
  return out;
}
function titleCase(str){
  return clean(str).toLowerCase().replace(/(^|\s|\(|\/)([a-záéíóúñü])/g, (m,p1,p2)=>p1+p2.toUpperCase());
}
function esc(str){
  return clean(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function debounce(fn, ms=250){
  let t;
  return (...args)=>{ clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
}
function secondsToClock(totalSeconds){
  const m = Math.floor(totalSeconds/60).toString().padStart(2,"0");
  const s = Math.floor(totalSeconds%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

// Convierte un booleano/textos típicos de CSV ("SI","NO","1","0","true"...) a boolean, o null si no reconocible.
function parseBoolish(v){
  const s = clean(v).toLowerCase();
  if (["si","sí","1","true","x","contratado","yes"].includes(s)) return true;
  if (["no","0","false",""].includes(s)) return s === "" ? null : false;
  return null;
}

// Reintenta una operación de Firestore si falla al arrancar la conexión
// (típico "client is offline" que ocurre solo en el primerísimo intento,
// antes de que el canal de red termine de establecerse). No reintenta
// errores de permisos u otros fallos reales, solo los de conectividad.
// Además, pone un límite de tiempo a cada intento: si una petición se
// queda "colgada" sin responder (ni éxito ni error), se da por fallida
// en vez de esperar para siempre, y se reintenta o se avisa al usuario.
function timeout(ms){
  return new Promise((_, reject) => setTimeout(() => reject(new Error("network-timeout: la operación tardó demasiado")), ms));
}
async function withRetry(fn, retries=3, delayMs=1000, timeoutMs=15000){
  let lastErr;
  for (let i=0; i<=retries; i++){
    try{
      return await Promise.race([ fn(), timeout(timeoutMs) ]);
    }catch(err){
      lastErr = err;
      const msg = (err && err.message) ? err.message.toLowerCase() : "";
      const esDeConexion = msg.includes("offline") || msg.includes("unavailable") || msg.includes("network");
      if (!esDeConexion || i === retries) throw err;
      await new Promise(r => setTimeout(r, delayMs * (i + 1)));
    }
  }
  throw lastErr;
}

// Lectura "caché primero", al estilo offline-first de la app del comedor:
// intenta leer al instante de la copia local (funciona aunque no haya red,
// e incluye los cambios que la propia app acaba de escribir aunque no se
// hayan sincronizado todavía) y solo si no hay nada en caché va al servidor.
async function getDocsSmart(q){
  try{
    const snap = await getDocsFromCache(q);
    if (!snap.empty) return snap;
  }catch(e){ /* todavía no hay nada en caché: seguimos al servidor */ }
  return await withRetry(() => getDocs(q));
}
async function getDocSmart(ref){
  try{
    const snap = await getDocFromCache(ref);
    if (snap.exists()) return snap;
  }catch(e){ /* todavía no hay nada en caché: seguimos al servidor */ }
  return await withRetry(() => getDoc(ref));
}

  // ==================== js/counters.js ====================
// Genera un número de expediente correlativo y único, tipo "2026-0001",
// usando una transacción de Firestore para que nunca se repita aunque dos
// personas guarden un parte casi a la vez. Las transacciones sí necesitan
// conexión en vivo (no pueden resolverse solo con la copia local), así que
// si no hay red a mano se usa un número provisional basado en la fecha y
// hora, para que el trámite nunca se quede esperando.
async function nextExpediente(){
  const year = new Date().getFullYear();
  const ref = doc(db, "contadores", `partes_${year}`);
  try{
    const num = await withRetry(() => runTransaction(db, async (tx)=>{
      const snap = await tx.get(ref);
      const actual = snap.exists() ? (snap.data().ultimo || 0) : 0;
      const siguiente = actual + 1;
      tx.set(ref, { ultimo: siguiente }, { merge: true });
      return siguiente;
    }), 1, 600, 6000);
    return `${year}-${String(num).padStart(4,"0")}`;
  }catch(err){
    console.warn("No se pudo generar el número de expediente correlativo (sin conexión); se usa uno provisional:", err);
    const now = new Date();
    const pad = n => String(n).padStart(2,"0");
    return `${year}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  }
}

let _cache = null;

async function loadAllStudents(force=false){
  if (_cache && !force) return _cache;
  const snap = await getDocsSmart(collection(db,"alumnado"));
  _cache = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  _cache.sort((a,b)=> (a.apellido1+a.apellido2).localeCompare(b.apellido1+b.apellido2, "es"));

async function searchStudents(text){

    const hay = `${a.nombre} ${a.apellido1} ${a.apellido2} ${a.grupo_clase} ${a.nif}`.toLowerCase();
    return q.split(/\s+/).every(part => hay.includes(part));
  }).slice(0, 25);
}

function rowToStudent(row){
  const idx = buildRowIndex(row);
  // Muchos alumnos no tienen "Dirección" propia rellena: en ese caso se
  // usa la dirección de la unidad familiar como domicilio del parte.
  const direccionPropia = clean(pick(idx, "Dirección", "Direccion"));
  const direccionFamiliar = clean(pick(idx, "Dirección de la unidad fam.", "Direccion de la unidad fam.", "Dirección de la unidad familiar"));
  const addr = parseAddress(direccionPropia || direccionFamiliar);
  const responsables = [];
  for (const n of [1,2]){
    const nombre = clean(pick(idx, `[Resp. ${n}] Nombre`));
    if (!nombre) continue;
    responsables.push({
      nombre,
      apellido1: clean(pick(idx, `[Resp. ${n}] Apellido1`)),
      apellido2: clean(pick(idx, `[Resp. ${n}] Apellido2`)),
      dni: clean(pick(idx, `[Resp. ${n}] Dni`)),
      email: clean(pick(idx, `[Resp. ${n}] Email`)),
      telefono: clean(pick(idx, `[Resp. ${n}] Teléfono/Teléfono Móvil`, `[Resp. ${n}] Telefono/Telefono Movil`)),
      responsabilidad: clean(pick(idx, `[Resp. ${n}] Responsablidad`, `[Resp. ${n}] Responsabilidad`))
    });
  }
  const servicioRaw = pick(idx, "Servicios Escolares 2026/2027", "Servicios Escolares", "Servicio Escolar", "Contratado Servicios Escolares");
  const servicio = parseBoolish(servicioRaw); // true/false/null (null = no viene en el CSV)

  return {
    cial: clean(pick(idx, "CIAL")),
    nif: clean(pick(idx, "NIF - NIE", "NIF-NIE", "NIF")),
    nombre: clean(pick(idx, "Nombre")),
    apellido1: clean(pick(idx, "Primer apellido")),
    apellido2: clean(pick(idx, "Segundo apellido")),
    sexo: clean(pick(idx, "Sexo")),
    fecha_nacimiento_str: clean(pick(idx, "Fecha de nacimiento")),
    grupo_clase: clean(pick(idx, "Grupo Clase")),
    num_lista: clean(pick(idx, "Nº Lista", "N° Lista", "No Lista", "Num Lista")),
    telefono: clean(pick(idx, "Tlf. SMS", "Tlf SMS")),
    calle: addr.calle, cp: addr.cp, poblacion: addr.poblacion, provincia: addr.provincia,
    _servicioFromCsv: servicio,
    responsables
  };
}

async function importStudents(rows, onProgress){
  const CHUNK = 150;
  let creados = 0, actualizados = 0, omitidos = 0;
  const total = rows.length;

  // Carga de una sola vez todo el alumnado ya existente, preferiblemente
  // desde la copia local (instantánea, funciona aunque no haya red). Si ni
  // siquiera eso está disponible, seguimos igualmente: en el peor caso se
  // trata todo como fila nueva/actualizada sin fusionar ediciones manuales,
  // pero la importación nunca se queda bloqueada por esto.
  let existingMap = new Map();
  try{
    const existingSnap = await getDocsSmart(collection(db,"alumnado"));
    existingSnap.docs.forEach(d => existingMap.set(d.id, d.data()));
  }catch(err){
    console.warn("No se pudo comprobar el alumnado existente antes de importar:", err);
  }

  for (let i=0; i<rows.length; i+=CHUNK){
    const chunk = rows.slice(i, i+CHUNK);
    const batch = writeBatch(db);
    let huboEscrituras = false;

    for (const row of chunk){
      if (!clean(pick(buildRowIndex(row), "Nombre"))){ omitidos++; continue; }
      const id = studentId(row);
      const incoming = rowToStudent(row);
      const servicioFromCsv = incoming._servicioFromCsv;
      delete incoming._servicioFromCsv;
      const ref = doc(db, "alumnado", id);
      const existing = existingMap.get(id);

      if (existing){
        const overrides = existing.manual_overrides || [];
        const merged = { ...incoming };
        for (const field of overrides){
          if (field in existing) merged[field] = existing[field];
        }
        // El estado del servicio solo se actualiza desde el CSV si viene informado
        // y no ha sido editado a mano; si no, se conserva el que ya había.
        if (servicioFromCsv !== null && !overrides.includes("servicio_contratado")){
          merged.servicio_contratado = servicioFromCsv;
        } else {
          merged.servicio_contratado = existing.servicio_contratado !== undefined ? existing.servicio_contratado : true;
        }
        merged.manual_overrides = overrides;
        merged.actualizado_en = serverTimestamp();
        batch.set(ref, merged, { merge:true });
        actualizados++;
      } else {
        batch.set(ref, {
          ...incoming,
          servicio_contratado: servicioFromCsv !== null ? servicioFromCsv : true,
          manual_overrides: [],
          creado_en: serverTimestamp(),
          actualizado_en: serverTimestamp()
        });
        creados++;
        existingMap.set(id, {}); // evita tratar como "nuevo" otra vez si el CSV repite la fila
      }
      huboEscrituras = true;
    }
    if (huboEscrituras){
      // Al estilo offline-first del comedor: el lote se escribe al instante
      // en la copia local y se sincroniza solo cuando haya red, sin hacer
      // esperar a quien está importando.
      batch.commit().catch(err => console.warn("Sincronización pendiente de un lote de alumnado:", err));
    }
    if (onProgress) onProgress(Math.min(i+CHUNK, total), total);
  }

  invalidateCache();
  logEvent("importar_alumnado", `${creados} creados, ${actualizados} actualizados, ${omitidos} omitidos (de ${total} filas)`);
  return { creados, actualizados, omitidos };
}

async function updateStudentManually(id, changes){
  const ref = doc(db, "alumnado", id);
  const snap = await getDocSmart(ref);
  const existing = snap.exists() ? snap.data() : {};
  const overrides = new Set(existing.manual_overrides || []);
  Object.keys(changes).forEach(k => overrides.add(k));
  updateDoc(ref, {
    ...changes,
    manual_overrides: Array.from(overrides),
    actualizado_en: serverTimestamp()
  }).catch(err => console.warn("Sincronización pendiente de la ficha del alumno:", err));
  invalidateCache();
  logEvent("editar_alumno", `${existing.apellido1||""}, ${existing.nombre||id} — campos: ${Object.keys(changes).join(", ")}`);
}

async function setServicioContratado(id, value){
  await updateStudentManually(id, { servicio_contratado: value });
}

function studentAge(fechaNacimientoStr){
  const d = parseSpanishDate(fechaNacimientoStr);
  if (!d) return null;
  const diff = Date.now() - d.getTime();
  return Math.floor(diff / (365.25*24*3600*1000));
}

import { PDFDocument, StandardFonts, rgb, PDFName } from "https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.esm.min.js";

const INK = rgb(0.08, 0.1, 0.14);

function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function drawFit(page, font, text, x, yBase, maxWidth, baseSize=9, minSize=6){
  text = clean(text);
  if (!text) return;
  let size = baseSize;
  while (size > minSize && font.widthOfTextAtSize(text, size) > maxWidth) size -= 0.25;
  if (font.widthOfTextAtSize(text, size) > maxWidth){
    while (text.length > 3 && font.widthOfTextAtSize(text + "…", size) > maxWidth) text = text.slice(0, -1);
    text = text + "…";
  }
  page.drawText(text, { x, y: yBase, size, font, color: INK });
}

function drawWrapped(page, font, text, slots, size=8){
  let remaining = clean(text);
  if (!remaining) return;
  for (let i=0; i<slots.length; i++){
    if (!remaining) break;
    const slot = slots[i];
    const isLast = i === slots.length - 1;
    const words = remaining.split(/\s+/);
    let line = "", consumed = 0;
    for (const w of words){
      const test = line ? line + " " + w : w;
      if (font.widthOfTextAtSize(test, size) <= slot.maxWidth){ line = test; consumed++; }
      else break;
    }
    if (!line && words.length){
      line = words[0];
      while (line.length > 1 && font.widthOfTextAtSize(line, size) > slot.maxWidth) line = line.slice(0, -1);
      consumed = 1;
    }
    remaining = words.slice(consumed).join(" ");
    if (isLast && remaining){
      let t = line;
      while (t.length > 1 && font.widthOfTextAtSize(t + "…", size) > slot.maxWidth) t = t.slice(0, -1);
      line = t + "…";
    }
    if (line) page.drawText(line, { x: slot.x, y: slot.y, size, font, color: INK });
  }
}

function quitarAnotacionesFijas(pdfDoc, page){
  const annotsRef = page.node.get(PDFName.of("Annots"));
  if (!annotsRef) return;
  const annots = pdfDoc.context.lookup(annotsRef);
  if (!annots || typeof annots.asArray !== "function") return;
  const arr = annots.asArray();
  for (let i = arr.length - 1; i >= 0; i--){
    const obj = pdfDoc.context.lookup(arr[i]);
    if (!obj || typeof obj.get !== "function") continue;
    const subtype = obj.get(PDFName.of("Subtype"));
    if (!subtype || subtype.toString() !== "/FreeText") continue;
    const contents = obj.get(PDFName.of("Contents"));
    const text = contents && contents.decodeText ? contents.decodeText() : "";
    if (ANOTACIONES_FIJAS.has(text)) annots.remove(i);
  }
}

function downloadPdfBytes(bytes, filename){
  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}

function createStopwatch(mountEl, { onChange } = {}){
  let seconds = 0;
  let running = false;
  let intervalId = null;

  function render(){
    mountEl.innerHTML = `
      <div class="timer-box">
        <div>
          <div class="timer-display" id="sw-display">${secondsToClock(seconds)}</div>
          <div class="timer-label">Tiempo de espera hasta que el seguro atendió la llamada</div>
        </div>
        <div class="timer-controls">
          <button class="btn btn-amber btn-sm" id="sw-toggle">${running ? "Pausar" : (seconds>0 ? "Reanudar" : "Iniciar")}</button>
          <button class="btn btn-outline btn-sm" id="sw-reset" style="border-color:rgba(255,255,255,.4); color:#fff;">Reiniciar</button>
        </div>
      </div>
    `;
    mountEl.querySelector("#sw-toggle").onclick = toggle;
    mountEl.querySelector("#sw-reset").onclick = reset;
  }
  function tick(){
    seconds += 1;
    const disp = mountEl.querySelector("#sw-display");
    if (disp) disp.textContent = secondsToClock(seconds);
    if (onChange) onChange(seconds);
  }
  function toggle(){
    running = !running;
    if (running){ intervalId = setInterval(tick, 1000); } else { clearInterval(intervalId); }
    render();
  }
  function reset(){
    running = false; clearInterval(intervalId); seconds = 0; render();
    if (onChange) onChange(seconds);
  }
  render();
  return {
    getSeconds: ()=>seconds,
    stop: ()=>{ running=false; clearInterval(intervalId); },
    destroy: ()=>{ clearInterval(intervalId); }
  };
}

async function loadAllPartes(force=false){

  const q = query(collection(db,"partes_accidente"), orderBy("creado_en","desc"));

// (apellidos/nombre del lesionado o nº de expediente).
async function searchPartes(text, max=10){
  const list = await loadAllPartes();
  const q = (text||"").trim().toLowerCase();
  if (!q) return list.slice(0, max);
  return list.filter(p=>{
    const s = p.alumno_snapshot || {};
    const hay = `${s.nombre} ${s.apellido1} ${s.apellido2} ${p.numero_expediente||""}`.toLowerCase();
    return hay.includes(q);
  }).slice(0, max);
}

function handleFileUpload(e){
  const file = e.target.files[0];
  if (!file) return;
  const progress = document.getElementById("csv-progress");
  const ext = (file.name.split(".").pop() || "").toLowerCase();

  async function runImport(rows){
    progress.textContent = `Importando ${rows.length} filas...`;
    try{
      const { creados, actualizados, omitidos } = await importStudents(rows, (done,total)=>{
        progress.textContent = `Importando... ${done}/${total}`;
      });
      progress.textContent = `Hecho: ${creados} nuevos, ${actualizados} actualizados, ${omitidos} omitidos.`;
      toast("Importación completada.", "ok");
      renderAlumnado();
    }catch(err){
      console.error(err);
      progress.textContent = "Error al importar: " + err.message;
      toast("Error al importar el archivo.", "error");
    }
  }

  if (ext === "xlsx" || ext === "xls"){
    progress.textContent = "Leyendo archivo Excel...";
    const reader = new FileReader();
    reader.onload = (evt)=>{
      try{
        const wb = XLSX.read(evt.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: false });
        runImport(rows);
      }catch(err){
        console.error(err);
        progress.textContent = "Error al leer el Excel: " + err.message;
        toast("Error al leer el archivo Excel.", "error");
      }
    };
    reader.onerror = ()=>{ progress.textContent = "Error al leer el archivo."; };
    reader.readAsArrayBuffer(file);
  } else {
    progress.textContent = "Leyendo archivo CSV...";
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      encoding: "ISO-8859-1",
      complete: (results)=> runImport(results.data),
      error: (err)=>{ progress.textContent = "Error al leer el archivo: " + err.message; }
    });
  }
}

async function runTramite(){
  // 1) Fecha y hora del documento
  const fechaElaboracion = await askDateTime({
    step: "1 / 9", title: "Fecha del documento",
    question: "Confirma la fecha y hora en la que se está elaborando este parte.",
    initial: new Date()
  });
  if (!fechaElaboracion) return;

  // 2) Alumno accidentado
  const alumnoId = await askStudent({ step: "2 / 9", title: "Alumno/a accidentado/a" });
  if (!alumnoId) return;
  const alumno = await getStudent(alumnoId);
  if (!alumno) return;

  // 3) Comprobación del servicio contratado
  if (alumno.servicio_contratado === false){
    const nombreCompleto = `${alumno.apellido1} ${alumno.apellido2}, ${alumno.nombre}`;
    await showBlocking({
      title: "Trámite no disponible",
      message: `No se puede tramitar Parte de Accidente al alumno/a <b>"${esc(nombreCompleto)}"</b> por no estar al corriente del concepto Servicios Escolares 2.026 / 2.027 (impago o no contratación de este).`
    });
    logEvent("tramite_bloqueado", `${nombreCompleto} — Servicios Escolares 2026/2027 no contratado (impago o no contratación)`);
    renderLanding();
    return;
  }

  // 4) Fecha y hora del accidente
  const fechaAccidente = await askDateTime({
    step: "3 / 9", title: "Fecha del accidente",
    question: "Indica la fecha y hora en que ocurrió el accidente.",
    initial: fechaElaboracion
  });
  if (!fechaAccidente) return;

  // 5) Hechos y actividad — "indicar lo que pasó"
  const hechos = await askText({
    step: "4 / 9", title: "Datos del accidente",
    fields: [
      { key:"actividad", label:"¿Qué actividad desarrollaba en ese momento?", placeholder:"Ej. recreo, educación física..." },
      { key:"descripcion", label:"Explica con la mayor claridad posible cómo ocurrió el accidente", multiline:true }
    ]
  });
  if (!hechos) return;

  // 6) Atención médica
  const medica = await askYesNo({
    step: "5 / 9", title: "Atención médica", question: "¿Ha recibido atención médica?",
    extraFields: [
      { key:"centro", label:"Centro médico / facultativo" },
      { key:"diagnostico", label:"Pruebas realizadas y diagnóstico", multiline:true }
    ]
  });
  if (medica === null) return;

  // 7) Autoridad, otra póliza y testigos
  const autoridad = await askYesNo({
    step: "6 / 9", title: "Intervención de la autoridad", question: "¿Intervino la autoridad (policía, guardia civil...)?",
    extraFields: [ { key:"cual", label:"¿Cuál?" }, { key:"localidad", label:"¿De qué localidad?" } ]
  });
  if (autoridad === null) return;

  const poliza = await askYesNo({
    step: "7 / 9", title: "Otra póliza",
    question: "¿Tiene el tomador o el lesionado otra póliza de seguro que garantice este accidente?",
    extraFields: [ { key:"cual", label:"¿Cuál?" } ]
  });
  if (poliza === null) return;

  const testigos = await askYesNo({
    step: "8 / 9", title: "Testigos", question: "¿Hubo testigos del accidente?",
    extraFields: [ { key:"detalle", label:"Nombre y datos de contacto de los testigos", multiline:true } ]
  });
  if (testigos === null) return;

  // 8) Cronómetro de atención telefónica del seguro (opcional)
  const tiempoSegundos = await askStopwatchModal();

  // 9) Número de registro/siniestro que da la aseguradora por teléfono
  //    (último dato antes de generar el documento, tal y como se pidió).
  const registro = await askText({
    step: "9 / 9", title: "Número de registro de la aseguradora",
    intro: "El número de registro o siniestro que te ha dado la aseguradora por teléfono, si ya lo tienes. Se anota en el campo \"Certificado\" del parte.",
    fields: [ { key:"numero", label:"Número de registro / siniestro", placeholder:"Déjalo en blanco si aún no lo tienes" } ]
  });
  const numeroRegistro = registro ? registro.numero : "";

  // 10) Montar, generar el PDF de Allianz y guardar
  const draft = {
    alumno_id: alumno.id,
    alumno_snapshot: {
      nombre: alumno.nombre, apellido1: alumno.apellido1, apellido2: alumno.apellido2,
      fecha_nacimiento_str: alumno.fecha_nacimiento_str, nif: alumno.nif,
      calle: alumno.calle, cp: alumno.cp, poblacion: alumno.poblacion, provincia: alumno.provincia,
      telefono: alumno.telefono, grupo_clase: alumno.grupo_clase
    },
    fecha_accidente: fechaAccidente,
    fecha_elaboracion: fechaElaboracion,
    actividad: hechos.actividad,
    descripcion_hechos: hechos.descripcion,
    atencion_medica: { si: medica.si, centro: medica.centro||"", diagnostico: medica.diagnostico||"" },
    intervino_autoridad: { si: autoridad.si, cual: autoridad.cual||"", localidad: autoridad.localidad||"" },
    otra_poliza: { si: poliza.si, cual: poliza.cual||"" },
    testigos: { si: testigos.si, detalle: testigos.detalle||"" },
    tiempo_respuesta_segundos: tiempoSegundos,
    numero_registro_aseguradora: numeroRegistro
  };

  try{
    const numeroExpediente = await nextExpediente();
    const pdfBytes = await fillAllianzPdf(draft);
    const payload = {
      ...draft,
      numero_expediente: numeroExpediente,
      fecha_accidente: Timestamp.fromDate(draft.fecha_accidente),
      fecha_elaboracion: Timestamp.fromDate(draft.fecha_elaboracion),
      creado_en: serverTimestamp(),
      estado: "completado"
    };
    // Al estilo offline-first del comedor: el ID se genera en el propio
    // dispositivo (sin red) y el guardado se hace al instante en la copia
    // local, sin esperar a que el servidor lo confirme. El parte y su PDF
    // quedan listos aunque la conexión esté fallando en ese momento.
    const ref = doc(collection(db,"partes_accidente"));
    setDoc(ref, payload).catch(err => console.warn("Sincronización pendiente del parte:", err));
    logEvent("crear_parte", `${numeroExpediente} — ${draft.alumno_snapshot.apellido1}, ${draft.alumno_snapshot.nombre}`);
    invalidatePartesCache();

    const filename = `parte-accidente_${slugify(draft.alumno_snapshot.apellido1+'-'+draft.alumno_snapshot.nombre)}_${slugify(formatDateTimeEs(draft.fecha_accidente))}.pdf`;
    renderResult({
      ok: true,
      title: "Proceso finalizado",
      message: `El parte <b>${esc(numeroExpediente)}</b> de ${esc(draft.alumno_snapshot.apellido1)}, ${esc(draft.alumno_snapshot.nombre)} se ha registrado correctamente y el documento está listo.`,
      pdfBytes, filename
    });
  }catch(e){
    console.error(e);
    toast("No se pudo completar el trámite: " + e.message, "error");
  }
}

function askStopwatchModal(){
  return new Promise((resolve)=>{
    const backdrop = document.getElementById("modal-backdrop");
    const box = document.getElementById("modal-box");
    box.innerHTML = `
      <div class="modal-head"><h3>Tiempo de respuesta del seguro</h3><span class="step">8 / 9</span></div>
      <div class="modal-body">
        <div class="q">Actívalo al llamar a la aseguradora para registrar cuánto tardan en atender (opcional).</div>
        <div id="sw-mount"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="sw-skip">Omitir</button>
        <button class="btn btn-primary" id="sw-continue">Continuar</button>
      </div>
    `;
    backdrop.classList.add("show");
    const sw = createStopwatch(document.getElementById("sw-mount"));
    function finish(seconds){
      sw.destroy();
      backdrop.classList.remove("show");
      box.innerHTML = "";
      resolve(seconds);
    }
    document.getElementById("sw-skip").onclick = ()=> finish(0);
    document.getElementById("sw-continue").onclick = ()=> finish(sw.getSeconds());
  });
}

  }, 250));
}

function renderParteCards(el, partes){
  if (partes.length===0){
    el.innerHTML = `<p class="muted">No hay partes que coincidan.</p>`;
    return;
  }
  el.innerHTML = partes.map(p=>{
    const s = p.alumno_snapshot || {};
    return `
      <div class="parte-card" data-id="${p.id}">
        <div class="exp">${esc(p.numero_expediente)||"—"}</div>
        <div class="name">${esc(s.apellido1)} ${esc(s.apellido2)}, ${esc(s.nombre)}</div>
        <div class="date">${formatDateTimeEs(p.fecha_accidente)}</div>
      </div>
    `;
  }).join("");
  el.querySelectorAll(".parte-card").forEach(card=>{
    card.addEventListener("click", async ()=>{
      card.classList.add("loading");
      try{
        await downloadParteById(card.dataset.id);
      }catch(err){
        console.error(err);
        toast("No se pudo abrir el PDF: " + err.message, "error");
      }finally{
        card.classList.remove("loading");
      }
    });
  });
}

  // ==================== js/admin.js ====================
const TIPO_LABEL = {
  login: "Inicio", crear_parte: "Parte creado", editar_parte: "Parte editado",
  eliminar_parte: "Parte eliminado", tramite_bloqueado: "Trámite bloqueado",
  importar_alumnado: "Importación de alumnado", editar_alumno: "Ficha de alumno editada",
  acceso_admin: "Acceso al panel de administrador"
};
const TIPO_BADGE = {
  crear_parte: "badge-forest", eliminar_parte: "badge-burgundy", tramite_bloqueado: "badge-burgundy",
  editar_parte: "badge-amber", editar_alumno: "badge-amber", importar_alumnado: "badge-slate",
  acceso_admin: "badge-slate"
};

const ADMIN_TABS = [
  { id:"registro", label:"Registro de acciones", render: renderTabRegistro },
  { id:"usuarios", label:"Usuarios", render: renderTabUsuarios },
  { id:"equipo", label:"Equipo con acceso", render: renderTabEquipo },
  { id:"alumnado", label:"Alumnado", render: renderTabAlumnado },
  { id:"partes", label:"Partes de accidente", render: renderTabPartes },
];

function renderAdmin(){
  const main = document.getElementById("view-admin");
  if (!isAdminUnlocked()){
    renderGate(main);
  } else {
    renderShell(main);
  }
}

function renderGate(main){
  main.innerHTML = `
    <div id="landing-wrap">
      <div class="landing-card">
        <div class="icon-ring" style="background:var(--ink-tint); color:var(--ink);">🔒</div>
        <h1>Administrador</h1>
        <p>Acceso restringido al equipo administrador del centro.</p>
        <form id="admin-gate-form" style="text-align:left;">
          <div class="field"><label>Tu nombre</label><input type="text" id="ag-name" value="${DEFAULT_ADMIN_NAME}" required></div>
          <div class="field"><label>Clave de acceso</label><input type="password" id="ag-pass" required></div>
          <div class="login-error" id="ag-error"></div>
          <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>
        <button class="btn btn-ghost btn-block" id="ag-cancel" style="margin-top:.6em;">Volver al inicio</button>
      </div>
    </div>
  `;
  document.getElementById("ag-cancel").onclick = ()=> navigate("landing");
  document.getElementById("admin-gate-form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const name = document.getElementById("ag-name").value.trim();
    const pass = document.getElementById("ag-pass").value;
    const errEl = document.getElementById("ag-error");
    const btn = e.target.querySelector("button[type=submit]");
    errEl.classList.remove("show");

    // La clave maestra siempre funciona al instante, sin tocar Firestore
    // (útil si la conexión falla). Los usuarios creados en el panel se
    // comprueban contra Firestore, con un límite de espera para que el
    // formulario nunca se quede colgado si no hay conexión.
    let ok = checkAdminPassword(pass);
    if (!ok){
      btn.disabled = true; btn.textContent = "Comprobando...";
      try{
        ok = await Promise.race([
          checkAdminCredentials(name, pass),
          new Promise(resolve => setTimeout(()=> resolve(false), 6000))
        ]);
      }catch(err){
        console.error(err);
        ok = false;
      }
      btn.disabled = false; btn.textContent = "Entrar";
    }

    if (!ok){
      errEl.textContent = "Nombre o clave incorrectos.";
      errEl.classList.add("show");
      return;
    }
    setAdminName(name);
    // El registro de auditoría se envía en segundo plano: si Firestore
    // tarda o falla, el acceso al panel no debe quedarse esperando.
    logEvent("acceso_admin", name);
    renderAdmin();
  });
}

function renderShell(main){
  main.innerHTML = `
    <div class="view-header">
      <div class="eyebrow">Panel interno</div>
      <h1>Administrador</h1>
      <p class="muted">Sesión de: ${esc(getAdminName())} · <a id="admin-logout" style="cursor:pointer; text-decoration:underline;">Salir</a></p>
    </div>
    <div class="pill-tabs" id="admin-tabs"></div>
    <div id="admin-tab-content"></div>
  `;
  document.getElementById("admin-logout").onclick = ()=>{
    lockAdmin();
    navigate("landing");
  };
  const tabsEl = document.getElementById("admin-tabs");
  tabsEl.innerHTML = ADMIN_TABS.map((t,i)=>`<button class="pill ${i===0?'active':''}" data-id="${t.id}">${t.label}</button>`).join("");
  tabsEl.querySelectorAll(".pill").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      tabsEl.querySelectorAll(".pill").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      const tab = ADMIN_TABS.find(t=>t.id===btn.dataset.id);
      tab.render();
    });
  });
  ADMIN_TABS[0].render();
}

function tabContainer(){ return document.getElementById("admin-tab-content"); }

// ---- Registro de acciones ----
async function renderTabRegistro(){
  const el = tabContainer();
  el.innerHTML = `
    <div class="card">
      <div class="field"><input type="text" id="rg-filter" placeholder="Filtrar por persona o tipo de acción..."></div>
      <div id="rg-table"><p class="muted">Cargando...</p></div>
    </div>
  `;
  let logs = [];
  try{
    logs = await fetchLogs(300);
  }catch(err){
    console.error(err);
    document.getElementById("rg-table").innerHTML =
      `<div class="empty-state"><h3>No se pudo cargar el registro</h3><p class="muted">Comprueba la conexión con Firebase.</p></div>`;
    return;
  }
  const draw = (list)=>{
    const table = document.getElementById("rg-table");
    if (list.length===0){ table.innerHTML = `<div class="empty-state"><h3>Sin actividad registrada</h3></div>`; return; }
    table.innerHTML = `
      <div class="table-scroll"><table>
        <thead><tr><th>Fecha</th><th>Acción</th><th>Persona</th><th>Detalle</th></tr></thead>
        <tbody>
          ${list.map(l=>`
            <tr>
              <td>${l.creado_en ? formatDateTimeEs(l.creado_en) : "—"}</td>
              <td><span class="badge ${TIPO_BADGE[l.tipo]||'badge-slate'}">${TIPO_LABEL[l.tipo]||l.tipo}</span></td>
              <td>${esc(l.usuario)}</td>
              <td class="muted">${esc(l.detalle)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table></div>
    `;
  };
  draw(logs);
  document.getElementById("rg-filter").addEventListener("input", (e)=>{
    const q = e.target.value.toLowerCase();
    draw(logs.filter(l=> `${l.usuario} ${l.tipo} ${l.detalle}`.toLowerCase().includes(q)));
  });
}

// ---- Usuarios administradores (credenciales reales de acceso al panel) ----
async function renderTabUsuarios(){
  const el = tabContainer();
  el.innerHTML = `
    <div class="card">
      <div class="card-title"><span>Crear usuario administrador</span><span class="tag">para pruebas</span></div>
      <p class="muted">Además de la clave maestra, puedes crear cuentas con nombre y contraseña propios para entrar al panel — útil para pruebas o para dar acceso a otra persona sin compartir la clave principal.</p>
      <div class="grid-2">
        <div class="field"><label>Nombre de usuario</label><input id="us-nombre" placeholder="Ej. Prueba1"></div>
        <div class="field"><label>Contraseña</label><input id="us-pass" type="text" placeholder="Ej. 1234"></div>
      </div>
      <button class="btn btn-primary" id="us-add">Crear usuario</button>
      <p class="small-note">La contraseña se guarda tal cual (sin cifrar), igual que la clave maestra del archivo — pensado para uso interno del centro, no para credenciales sensibles.</p>
    </div>
    <div class="card">
      <div class="card-title"><span>Usuarios creados</span></div>
      <div id="us-table"><p class="muted">Cargando...</p></div>
    </div>
  `;
  document.getElementById("us-add").onclick = async ()=>{
    const nombre = document.getElementById("us-nombre").value.trim();
    const password = document.getElementById("us-pass").value;
    if (!nombre || !password){ toast("Indica nombre y contraseña.", "error"); return; }
    addDoc(collection(db,"admin_usuarios"), {
      nombre, nombre_lower: nombre.toLowerCase(), password, activo: true, creado_en: serverTimestamp()
    }).catch(err => console.warn("Sincronización pendiente del nuevo usuario:", err));
    logEvent("acceso_admin", `Usuario creado: ${nombre}`);
    toast("Usuario creado.", "ok");
    renderTabUsuarios();
  };

  let rows = [];
  try{
    const snap = await getDocsSmart(collection(db,"admin_usuarios"));
    rows = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  }catch(err){
    console.error(err);
    document.getElementById("us-table").innerHTML =
      `<div class="empty-state"><h3>No se pudo cargar el listado</h3><p class="muted">Comprueba la conexión con Firebase.</p></div>`;
    return;
  }
  const table = document.getElementById("us-table");
  if (rows.length===0){
    table.innerHTML = `<p class="muted">Todavía no has creado ningún usuario.</p>`;
    return;
  }
  table.innerHTML = `
    <div class="table-scroll"><table>
      <thead><tr><th>Nombre</th><th>Contraseña</th><th>Estado</th><th>Alta</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr>
            <td>${esc(r.nombre)}</td>
            <td><span class="muted">${esc(r.password)}</span></td>
            <td>${r.activo ? '<span class="badge badge-forest">Activo</span>' : '<span class="badge badge-burgundy">Desactivado</span>'}</td>
            <td>${r.creado_en ? formatDateTimeEs(r.creado_en) : "—"}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-ghost btn-sm" data-toggle="${r.id}" data-active="${r.activo}">${r.activo ? "Desactivar" : "Activar"}</button>
              <button class="btn btn-ghost btn-sm" data-del="${r.id}">Eliminar</button>
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table></div>
  `;
  table.querySelectorAll("[data-toggle]").forEach(btn=>{
    btn.onclick = async ()=>{
      const activo = btn.dataset.active === "true";
      updateDoc(doc(db,"admin_usuarios", btn.dataset.toggle), { activo: !activo })
        .catch(err => console.warn("Sincronización pendiente:", err));
      logEvent("acceso_admin", `Usuario ${activo ? "desactivado" : "activado"}: ${btn.dataset.toggle}`);
      renderTabUsuarios();
    };
  });
  table.querySelectorAll("[data-del]").forEach(btn=>{
    btn.onclick = async ()=>{
      const row = rows.find(r=>r.id===btn.dataset.del);
      if (!confirm(`¿Eliminar el usuario "${row.nombre}"?`)) return;
      deleteDoc(doc(db,"admin_usuarios", btn.dataset.del)).catch(err => console.warn("Sincronización pendiente:", err));
      logEvent("acceso_admin", `Usuario eliminado: ${row.nombre}`);
      toast("Usuario eliminado.", "ok");
      renderTabUsuarios();
    };
  });
}

  }catch(err){
    console.error(err);
    document.getElementById("eq-table").innerHTML =

    <div class="table-scroll"><table>
      <thead><tr><th>Nombre</th><th>Rol / equipo</th><th>Notas</th><th>Alta</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr>
            <td>${esc(r.nombre)}</td>
            <td>${esc(r.rol)}</td>
            <td class="muted">${esc(r.notas)}</td>
            <td>${r.creado_en ? formatDateTimeEs(r.creado_en) : "—"}</td>
            <td><button class="btn btn-ghost btn-sm" data-del="${r.id}">Quitar</button></td>
          </tr>
        `).join("")}
      </tbody>

  `;
  table.querySelectorAll("[data-del]").forEach(btn=>{
    btn.onclick = async ()=>{
      const row = rows.find(r=>r.id===btn.dataset.del);

  });

  // ==================== js/main.js ====================
const VIEWS = {
  landing: renderLanding,
  admin: renderAdmin,
};

function buildTopbar(){
  document.getElementById("brand-link").addEventListener("click", ()=> navigate("landing"));
}

function navigate(id){
  document.querySelectorAll(".view").forEach(el=> el.classList.remove("active"));
  let target = document.getElementById(`view-${id}`);
  if (!target){
    target = document.createElement("div");
    target.className = "view";
    target.id = `view-${id}`;
    document.getElementById("main").appendChild(target);
  }
  target.classList.add("active");
  const render = VIEWS[id];
  if (render) render();
}

document.addEventListener("DOMContentLoaded", ()=>{
  buildTopbar();
  // La interfaz se muestra siempre al instante, sin esperar a Firebase.
  navigate("landing");
  // La sesión anónima (necesaria para leer/escribir en Firestore) se
  // establece en segundo plano; si tarda o falla, la app sigue siendo
  // usable y cada acción que la necesite mostrará su propio aviso de error.
  try{
    ensureFirebaseSession(()=>{ /* sesión lista */ });
  }catch(err){
    console.error("No se pudo iniciar la sesión de Firebase:", err);
  }
});
</script>
